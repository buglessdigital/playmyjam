name: CI

# Her push ve PR'da derleme öncesi kontroller. Build'i Vercel zaten her push'ta
# alıyor (mekan listesi build sırasında Supabase'den çekildiği için burada
# prod anahtarı gerekirdi) — bu iş anahtarsız çalışır.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tip kontrolü
        run: npm run typecheck
      - name: Testler
        run: npm test
